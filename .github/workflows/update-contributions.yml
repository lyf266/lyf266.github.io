name: Update GitHub Contributions

on:
  schedule:
    # 每天 UTC 00:00 自动更新
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-contributions:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch latest contributions
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/update_contributions.py

      - name: Commit and push changes
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add data/github-contributions.json
          if git diff --staged --quiet; then
            echo "No changes in contributions data."
          else
            git commit -m "chore(data): auto-update github contributions [skip ci]"
            git pull --rebase origin main
            git push origin main
          fi
